<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bake to Baseline | Free Somatic Baking Guide</title>
  <style>
    :root {
      --bg-color: #FBF9F5;        /* Warm parchment background */
      --card-bg: #FFFDF9;         /* Soft ivory card */
      --border-outer: #E6DCB8;    /* Gilded taupe outer border */
      --border-inner: #F0E6D2;    /* Soft inner accent line */
      --text-primary: #2B2825;    /* Deep charcoal ink */
      --text-muted: #625B54;      /* Soft warm grey */
      --accent-gold: #B89659;     /* Gilded spoon bronze/gold */
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      font-family: 'Georgia', serif;
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      max-width: 580px;
      margin: 40px 20px;
      padding: 55px 30px;
      border: 1px solid var(--border-outer);
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      text-align: center;
      position: relative;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 1px solid var(--border-inner);
      pointer-events: none;
    }

    /* Logo Styling */
    .brand-logo {
      max-width: 85px; /* Adjust size if you want it larger/smaller */
      height: auto;
      margin-bottom: 12px;
      display: inline-block;
    }

    .brand-name {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 12px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    h1 {
      font-size: 28px;
      font-weight: normal;
      font-style: italic;
      color: var(--text-primary);
      margin: 0 0 15px 0;
      line-height: 1.3;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .divider {
      height: 1px;
      background-color: var(--border-inner);
      margin: 20px auto;
      width: 40%;
    }

    .form-wrapper {
      margin-top: 15px;
      position: relative;
      z-index: 2;
      border-radius: 2px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 520px;
      border: none;
      background: transparent;
    }

    .footer-note {
      margin-top: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- YOUR BRAND LOGO -->
    <img src="https://imgur.com/R1G4s6r.png" alt="The Gilded Spoon Shoppe Logo" class="brand-logo">
    
    <div class="brand-name">The Gilded Spoon Shoppe</div>
    
    <h1>Take a quiet breath before preheating the oven.</h1>
    
    <p>Join our quiet archive to receive <strong>Bake to Baseline</strong>—a free 1-page somatic guide for low-overwhelm baking and sensory kitchen rituals.</p>

    <div class="divider"></div>

    <div class="form-wrapper">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeNhynT2TEUkIBl_H35WhOKU7luGxfFWM2V-Hy9dOH2XJkxZg/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>

    <div class="footer-note">
      Quiet kitchen notes for sensitive nervous systems
    </div>
  </div>

</body>
</html>
